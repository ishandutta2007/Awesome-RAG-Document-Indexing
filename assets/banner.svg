<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerHighlight" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Orbs -->
  <circle cx="240" cy="100" r="160" fill="url(#orbGlow1)">
    <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;260;220" dur="10s" repeatCount="indefinite"/>
  </circle>

  <circle cx="960" cy="240" r="180" fill="url(#orbGlow2)">
    <animate attributeName="r" values="160;210;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;260;220" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Background Animated Data / Document Indexing Nodes Flow (Left & Right Flanks) -->
  <g opacity="0.45">
    <!-- Left Circuit Lines -->
    <path d="M 40 180 Q 140 120, 220 180 T 360 180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 220 Q 150 260, 240 210 T 340 240" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="40" dur="3.5s" repeatCount="indefinite"/>
    </path>

    <!-- Left Pulsing Nodes -->
    <circle cx="140" cy="148" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="180" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="3.5" fill="#c084fc"/>

    <!-- Right Circuit Lines -->
    <path d="M 840 180 Q 940 130, 1020 180 T 1160 180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 860 230 Q 960 270, 1050 220 T 1140 240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="3.8s" repeatCount="indefinite"/>
    </path>

    <!-- Right Pulsing Nodes -->
    <circle cx="940" cy="152" r="4.5" fill="#c084fc">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="180" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="190" r="3.5" fill="#818cf8"/>
  </g>

  <!-- Horizontal Indexing Scanning Beam -->
  <line x1="200" y1="318" x2="1000" y2="318" stroke="#1e293b" stroke-width="1"/>
  <line x1="300" y1="318" x2="450" y2="318" stroke="url(#primaryGlow)" stroke-width="2.5" filter="url(#glowEffect)">
    <animate attributeName="x1" values="200;750;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="350;900;350" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Foreground Content Container (Ensures 100% Unobstructed Readability) -->
  <g id="foregroundText" transform="translate(600, 175)" text-anchor="middle" filter="url(#softShadow)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, -96)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="-140" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="-124" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM &amp; DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text y="-32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Awesome <tspan fill="url(#primaryGlow)">RAG &amp; Document Indexing</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Structure-Aware Retrieval • Reasoning Navigation • Enterprise Neural Search
    </text>

    <!-- Category Feature Badges / Tags -->
    <g transform="translate(0, 68)">
      <!-- Pill 1 -->
      <g transform="translate(-290, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Vector &amp; Trees</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-95, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔍 Hybrid BM25+RRF</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(100, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🏢 Enterprise Search</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(295, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧠 Agentic RAG</text>
      </g>
    </g>
  </g>

  <!-- Modern Border Stroke -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
</svg>
